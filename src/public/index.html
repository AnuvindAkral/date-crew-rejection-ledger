<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Rejection Ledger · The Date Crew (demo)</title>
  <link rel="stylesheet" href="/app.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">RL</span>
      <span class="brand-name">Rejection Ledger</span>
      <span class="brand-tag">matchmaker workspace · synthetic demo</span>
    </div>
    <nav class="topnav">
      <button class="nav-btn" data-view="clients">Clients</button>
      <button class="nav-btn" data-view="candidates">Candidates</button>
      <button class="nav-btn" data-view="measurement">Measurement</button>
    </nav>
    <div class="topbar-right">
      <label class="matchmaker-label" for="matchmaker-select">Acting as</label>
      <select id="matchmaker-select" class="matchmaker-select" aria-label="Acting matchmaker"></select>
      <button class="ghost-btn" id="manage-mm-btn" title="Add a matchmaker record">+ Matchmaker</button>
      <button class="ghost-btn" id="reset-btn">Reset demo</button>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div id="toast" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="/app.js"></script>
</body>
</html>
